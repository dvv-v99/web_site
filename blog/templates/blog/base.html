{% load static %}<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}DV{% endblock %}</title>
  <meta name="description" content="{% block description %}Проекты и решения для бизнеса{% endblock %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Inter+Tight:wght@400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body id="top">

  {% include 'blog/partials/header.html' %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include 'blog/partials/footer.html' %}

  <script src="{% static 'js/main.js' %}" defer></script>
</body>

</html>
