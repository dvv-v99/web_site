{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Проекты</title>

 <style>
    
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      font-size:18px;
    }

    header {
    background: #000;
    padding: 15px 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

    header nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 30px;
      font-weight: bold;    
      font-size: 18px;      
    }

    header nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 60px;
      min-height: 70vh;
    }

  
    footer {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 20px;         
      font-size: 18px;
      width: 100%;
      box-sizing: border-box;
      
    }

    .logo {
      height: 90px;
      width: auto;
    }

    h1 { font-size: 36px; }
    h2 { font-size: 28px; }
    h3 { font-size: 22px; }
  </style>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header>
  <a href="/"><img src = "{% static 'logo black.png' %}" alt="Логотип сайта" class="logo"></a>
  <nav>
    <a href="/">Главная</a>
    <a href="/projects/">Проекты</a>
    <a href="/news/">Новости</a>
    <a href="/about/">О нас</a>
  </nav>
</header>

<main>
  <section class="content">
    <h2>Наши проекты</h2>
    <p>Текущие и реализованные проекты</p>
  </section>


  <div class="row">
  {% for project in projects %}  
  <div class="col-lg-4 col-md-6">
    <div class="card">
      <img src="{{ project.image.url }}" alt="{{ project.title }}">
      <div class="card-body">
        <h5>{{ project.title }}</h5>
        <p>{{ project.description }}</p>  
        <small class="text-muted">
          {{ project.created_at|date:"d.m.Y" }}  
        </small>
      </div>
    </div>
  </div>
  {% endfor %}
</div>


<footer>
  <p>© 2025 Мой сайт</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
